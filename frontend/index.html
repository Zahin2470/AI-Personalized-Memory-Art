<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Art — Turn moments into gallery-worthy art</title>
    <meta
      name="description"
      content="Upload a memory — photos, a voice note, a date — and Memory Art turns it into a one-of-one illustrated piece, ready to hang, gift, or keep."
    />

    <!--
      IMPORTANT: replace https://your-domain.com everywhere below with your
      real production URL once deployed - social platforms (Facebook,
      LinkedIn, Twitter/X, WhatsApp) fetch these tags directly from this
      file and cache the result, so a placeholder domain here means link
      previews will point at the wrong place until this is updated and the
      cache is invalidated (most platforms have a "scrape again" debug tool
      for that - e.g. Facebook's Sharing Debugger, Twitter's Card Validator).
    -->
    <link rel="canonical" href="https://your-domain.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memory Art" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />
    <!-- og:title, og:description, twitter:title, twitter:description are set
         per-page at runtime by src/components/Seo.jsx - these two static
         image/url tags are the only ones that can't reasonably vary per page. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React mounts, so the correct theme class is already on
      // <html> by first paint - without this, ThemeProvider's useEffect
      // (which only runs after mount/paint) would cause a visible flash of
      // the wrong theme on every load. Mirrors the same read ThemeProvider
      // does (lib/theme.jsx) - keep the two in sync if that logic changes.
      (function () {
        try {
          var stored = localStorage.getItem('memoryart_theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          /* localStorage unavailable (e.g. private browsing) - default to light, no crash */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
